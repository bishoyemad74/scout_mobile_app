name: Build Flutter APK

on:
  push:
    branches: [ "main", "master", "main-1" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Create Project, Generate Icon, and Build APK
        run: |
          # 1. إنشاء المشروع المؤقت بالاسم والمواصفات الصحيحة
          flutter create temp_project --platforms=android --org com.omelnour.scouts --project-name scout_app
          
          # 2. نقل ملفات الكود والأيقونة الخاصة بنا
          rm -rf temp_project/lib/*
          cp -r lib/* temp_project/lib/
          cp pubspec.yaml temp_project/pubspec.yaml
          if [ -f "app_icon.png" ]; then
            cp app_icon.png temp_project/app_icon.png
          fi
          
          # 3. الدخول للمشروع وتثبيت المكتبات
          cd temp_project
          flutter pub get

          # 4. توليد الأيقونة المخصصة للأندرويد تلقائياً وبأمان
          flutter pub run flutter_launcher_icons

          # 5. تعديل ملف build.gradle فقط لرفع minSdkVersion إلى 21 (بدون التلاعب اليدوي بالـ Manifest)
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' $GRADLE_FILE
          fi

          # 6. بناء ملف الـ APK النهائي
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            **/temp_project/build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
