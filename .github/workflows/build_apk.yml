name: Build Flutter APK

on:
  push:
    branches: [ "main", "master", "main-1" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Create Clean Flutter Project and Adjust SDK
        run: |
          # 1. إنشاء المشروع المؤقت
          flutter create temp_project --platforms=android --org com.scout.app
          
          # 2. نقل ملفات الكود الخاصة بنا
          rm -rf temp_project/lib/*
          cp -r lib/* temp_project/lib/
          cp pubspec.yaml temp_project/pubspec.yaml
          
          # 3. تعديل ملف build.gradle لرفع minSdkVersion إلى 21 كما تطلب مكتبة فايربيس
          GRADLE_FILE="temp_project/android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' $GRADLE_FILE
          fi

          # 4. بناء التطبيق
          cd temp_project
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            **/temp_project/build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
